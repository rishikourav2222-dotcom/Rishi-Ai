<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rishi AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7ff;color:#172033}
.app{max-width:520px;margin:auto;height:100vh;background:white;display:flex;flex-direction:column}
header{background:#2563eb;color:white;padding:18px;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block}
h1{font-size:21px;margin:0}header p{margin:4px 0 0;font-size:12px;opacity:.9}
#chat{flex:1;overflow:auto;padding:16px}.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-end}
.bubble{max-width:82%;padding:12px 15px;border-radius:18px;white-space:pre-wrap;line-height:1.45}
.bot .bubble{background:#eaf0ff}.user .bubble{background:#2563eb;color:white}
.quick{display:flex;gap:7px;overflow:auto;padding:8px 12px}
.quick button{white-space:nowrap;border:1px solid #d7dce8;background:white;border-radius:18px;padding:8px 12px}
.input{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
input{flex:1;border:1px solid #ccc;border-radius:25px;padding:13px 16px;font-size:15px;outline:none}
.send{width:48px;border:0;border-radius:50%;background:#2563eb;color:white;font-size:20px}
footer{display:flex;justify-content:space-between;padding:6px 14px 10px}
footer button{border:0;background:none;color:#666;font-size:12px}
</style>
